# An example configuration, with placeholders. The real one lives in the data directory
# (data/config/sources.toml, or wherever CONFIG_FILE points) and is not part of this repository.
#
# Credentials are never written here: each is the path of a file holding it.

# Optional: notifications through Apprise when a source fails, falls behind or backs up.
[alerts]
urls_file = "/run/secrets/alert_urls"   # Apprise URLs, one per line
# failing_minutes = 30
# backlog_minutes = 15
# progress_hours = 3
# progress_hours_by_source = { heating = 6 }   # sources whose progress trails by design
# repeat_hours = 6

# Where points go. Each destination is one database.
[destinations.home]
kind = "influx3"                    # or "influx2" (then also set org)
url = "http://influxdb:8181"
database = "example"
token_file = "/run/secrets/influxdb_token"

# A Tuya cloud project: every device's report log, one table per device category
# (table_prefix + category, such as tuya_cz for plugs), tagged device_id and category.
[sources.plugs]
kind = "tuya"
destination = "home"
# Optional: a push monitor (such as Uptime Kuma) called after this source's points are written.
heartbeat_url_file = "/run/secrets/plugs_heartbeat_url"
# enabled = false                   # keeps it out of `ingest-hub run`; --only still runs it

[sources.plugs.params]
region = "eu"                       # eu, weu, us, cn or in
access_id_file = "/run/secrets/tuya_access_id"
access_secret_file = "/run/secrets/tuya_access_secret"
# table_prefix = "tuya_"
# devices = ["<device id>", ...]    # only these; every device when unset
# unscaled_codes = ["add_ele"]      # integer codes stored without the specification's scale
# poll_minutes = 15
# lag_minutes = 60                  # progress stays this far behind each poll's start
# overlap_minutes = 120             # each poll re-fetches this much before the cursor
# rescan_hours = 48                 # ... and once every rescan_every_hours, this much
# rescan_every_hours = 24
# retention_days = 7                # how far back a new device is fetched
# discover_hours = 6                # how often the device list is refreshed

# An MQTT broker: JSON messages routed to tables by topic filter.
[sources.meter]
kind = "mqtt"
destination = "home"

[sources.meter.params]
host = "mosquitto"
# port = 1883
username = "ingest-hub"
password_file = "/run/secrets/mqtt_password"
# client_id = "ingest-hub-meter"   # names the persistent session
# qos = 1
# precision = "s"                  # s, ms, us or ns

[[sources.meter.params.routes]]
topic = "<meter name>/status/em:0"
table = "meter_power"
tags = { device = "{0}" }          # {0}: the topic's first segment
# numbers = "float"                # or "keep" to write integers as integers
# fields = ["total_act_power"]     # only these keys; every numeric key when unset
# timestamp_field = "ts"           # a key holding Unix seconds; receive time when unset

[[sources.meter.params.routes]]
topic = "<meter name>/status/emdata:0"
table = "meter_energy"
tags = { device = "{0}" }

# Frank Energie's public electricity market prices; no credentials needed.
[sources.prices]
kind = "frank"
destination = "home"

[sources.prices.params]
# table = "electricity_price"
# market = "power"                 # the market tag
# vat_rate = 0.21
# poll_hours = 6
# quarter_hours_from = 2025-10-01  # 15-minute periods from this day, hourly before

# A Vaillant heating system through the myVAILLANT cloud.
[sources.heating]
kind = "vaillant"
destination = "home"

[sources.heating.params]
username_file = "/run/secrets/vaillant_username"
password_file = "/run/secrets/vaillant_password"
# brand = "vaillant"
# country = "netherlands"          # as myPyllant names the country the account belongs to
# energy_minutes = 60
# state_minutes = 20
# lag_hours = 3                    # progress stays this far behind each energy poll
# rescan_hours = 48                # each energy poll re-reads this much before the cursor
# pause_minutes = 60               # the longest a quota or server error is waited out
