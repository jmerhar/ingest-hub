<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ingest-hub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #677085; --line: #e2e5eb;
    --ok: #1a7f4b; --warn: #a15c00; --bad: #b42318; --chip: #eef1f5;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1a1f27; --text: #e6e9ef; --muted: #98a1b3; --line: #2a313c;
      --ok: #4cc38a; --warn: #f0a646; --bad: #f97066; --chip: #232a35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 16px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ok { background: var(--ok); } .warn { background: var(--warn); } .bad { background: var(--bad); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 10px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .error { color: var(--bad); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 13px; }
  td { padding: 2px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  td + td { text-align: right; padding-left: 8px; white-space: nowrap; }
  .id { font-size: 11px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 0 8px;
          font-size: 12px; color: var(--muted); }
  #problem { display: none; }
  .upload { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .upload label { cursor: pointer; border: 1px solid var(--line); border-radius: 6px;
                  padding: 2px 10px; background: var(--chip); }
  .upload input { display: none; }
  .upload .done { color: var(--ok); }
  /* The upload help: a "?" beside the button, its tooltip above the row, as wide as the card. */
  .upload { position: relative; }
  .hint { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--line);
          background: var(--chip); color: var(--muted); font: 600 12px/1 system-ui, sans-serif;
          cursor: help; }
  .hint:hover, .hint:focus-visible, .open .hint { color: var(--text); border-color: var(--muted); }
  .tip { display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 10;
         background: var(--card); color: var(--text); border: 1px solid var(--line);
         border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
         font-size: 13px; line-height: 1.5; cursor: auto; }
  /* Keeps the tooltip open while the pointer crosses the gap from the "?" to it. */
  .tip::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; }
  .open .tip { display: block; }
  .tip p { margin: 0; }
  .tip .limit { margin-top: 8px; color: var(--muted); }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip);
         border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
  code.block { display: block; margin: 6px 0; padding: 6px 8px; user-select: all; }
</style>
</head>
<body>
<header>
  <h1>ingest-hub</h1>
  <span id="meta" class="muted small"></span>
  <span id="problem" class="error small"></span>
</header>
<main><div id="sources" class="grid"></div></main>
<script>
"use strict";
const REFRESH_MS = 15000;
// The outcome of the latest upload per source, kept here because the cards are rebuilt on every
// refresh.
const uploads = {};

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  for (const child of children) node.append(child instanceof Node ? child : String(child));
  return node;
}

function ago(seconds) {
  if (seconds == null) return "never";
  const s = Math.max(0, Math.round(seconds));
  if (s < 90) return s + " s ago";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return (s / 3600).toFixed(1) + " h ago";
  return Math.round(s / 86400) + " days ago";
}

function health(source, now) {
  if (source.state === "backing-off") return "bad";
  if (source.batches_rejected > 0 || (source.spool && source.spool.files > 0)) return "warn";
  const behind = Object.values(source.progress || {}).map(ms => now - ms / 1000);
  if (behind.some(s => s > 3 * 3600)) return "warn";
  if (source.last_error_at && (!source.last_success || source.last_error_at > source.last_success))
    return "warn";
  return "ok";
}

function destination(name, dest) {
  // The database is named only when it differs from the destination's own name.
  const where = dest.database && dest.database !== name ? name + " → " + dest.database : name;
  return dest.kind ? where + " (" + dest.kind + ")" : where;
}

async function upload(source, file) {
  uploads[source] = { text: "uploading " + file.name + "…" };
  refresh();
  try {
    const response = await fetch("api/sources/" + encodeURIComponent(source) + "/files", {
      method: "POST", body: file, headers: { "X-Filename": file.name },
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || "HTTP " + response.status);
    uploads[source] = { saved: body.saved, at: body.at };
    // The import takes a moment; look again soon rather than at the next regular refresh.
    setTimeout(refresh, 1500);
    setTimeout(refresh, 5000);
  } catch (error) {
    uploads[source] = { text: "upload failed: " + error.message, error: true };
  }
  refresh();
}

// Text with `code` in backticks, as nodes; code with a space in it, a command, as a block of its
// own that one click selects whole.
function withCode(text) {
  return text.split("`").map((part, i) =>
    i % 2 ? el("code", part.includes(" ") ? { class: "block" } : {}, part) : part);
}

function size(bytes) {
  const gib = 1024 ** 3, mib = 1024 ** 2;
  return bytes >= gib ? Math.round(bytes / gib) + " GiB" : Math.round(bytes / mib) + " MiB";
}

// The source whose upload help is open, and whether a click pinned it open. While one is open
// the cards are not rebuilt, so its text can be read and copied; the refresh catches up after.
const hint = { source: null, pinned: false, stale: false };

function closeHint() {
  document.querySelectorAll(".hint-wrap.open").forEach(node => node.classList.remove("open"));
  hint.source = null;
  hint.pinned = false;
  if (hint.stale) {
    hint.stale = false;
    refresh();
  }
}

function openHint(wrap, name, pinned) {
  document.querySelectorAll(".hint-wrap.open").forEach(node => node.classList.remove("open"));
  wrap.classList.add("open");
  hint.pinned = pinned || (hint.pinned && hint.source === name);
  hint.source = name;
}

// A "?" beside the upload button, with what to upload and the largest file in its tooltip.
function uploadHint(source) {
  if (!source.upload_help && !source.upload_max_bytes) return null;
  const tip = el("div", { class: "tip", role: "tooltip", id: "tip-" + source.name });
  if (source.upload_help) tip.append(el("p", {}, ...withCode(source.upload_help)));
  if (source.upload_max_bytes) {
    tip.append(el("p", { class: "limit" }, "Largest file: " + size(source.upload_max_bytes)));
  }
  const button = el("button", {
    type: "button", class: "hint", "aria-label": "What to upload", "aria-describedby": tip.id,
  }, "?");
  const wrap = el("span", { class: "hint-wrap" }, button, tip);
  if (hint.source === source.name) wrap.classList.add("open");
  wrap.addEventListener("pointerenter", () => openHint(wrap, source.name, false));
  wrap.addEventListener("pointerleave", () => { if (!hint.pinned) closeHint(); });
  button.addEventListener("click", event => {
    event.stopPropagation();
    if (hint.pinned && hint.source === source.name) closeHint();
    else openHint(wrap, source.name, true);
  });
  tip.addEventListener("click", event => event.stopPropagation());
  return wrap;
}

document.addEventListener("click", () => { if (hint.source) closeHint(); });
document.addEventListener("keydown", event => { if (event.key === "Escape") closeHint(); });

function uploader(source) {
  const input = el("input", { type: "file", accept: source.accepts_files.join(",") });
  input.addEventListener("change", () => { if (input.files.length) upload(source.name, input.files[0]); });
  const row = el("div", { class: "upload small" }, el("label", {}, "Upload a file…", input));
  const help = uploadHint(source);
  if (help) row.append(help);
  const latest = uploads[source.name];
  if (latest) {
    let text = latest.text, kind = latest.error ? "error" : "muted";
    if (latest.saved) {
      // The server's clock decides, so a browser whose clock is off does not matter.
      if (source.last_error_at != null && source.last_error_at >= latest.at) {
        text = "could not import " + latest.saved + "; see the last error";
        kind = "error";
      } else if (source.last_success != null && source.last_success >= latest.at) {
        text = "imported " + latest.saved;
        kind = "done";
      } else {
        text = "saved " + latest.saved + "; importing…";
      }
    }
    row.append(el("span", { class: kind }, text));
  }
  return row;
}

function card(source, doc) {
  const now = doc.now;
  const dest = doc.destinations[source.destination] || {};
  const level = health(source, now);
  const rows = [
    ["state", source.state + (source.restarts ? " (" + source.restarts + " restarts)" : "")],
    ["destination", destination(source.destination, dest)],
    ["last success", ago(source.last_success == null ? null : now - source.last_success)],
    ["last written", ago(source.last_written == null ? null : now - source.last_written)],
    ["points", source.points_emitted.toLocaleString()],
    ["batches", source.batches_written + " written, " + source.write_failures + " failed, "
                + source.batches_spooled + " spooled, " + source.batches_rejected + " rejected"],
  ];
  if (source.spool) {
    const sp = source.spool;
    rows.push(["spool", sp.files + " waiting" + (sp.oldest_seconds != null
      ? ", oldest " + ago(sp.oldest_seconds) : "") + (sp.dropped ? ", " + sp.dropped + " dropped" : "")]);
  }
  rows.push(["heartbeat", source.heartbeat_ok == null ? "—" : source.heartbeat_ok ? "ok" : "failing"]);
  const list = el("dl");
  for (const [k, v] of rows) list.append(el("dt", {}, k), el("dd", {}, v));
  if (source.last_error) {
    // An error that a later success has cleared stays listed, in grey rather than red.
    const cleared = source.last_success && source.last_success > source.last_error_at;
    list.append(el("dt", {}, "last error"),
      el("dd", { class: cleared ? "muted" : "error" },
         source.last_error + " (" + ago(now - source.last_error_at) + (cleared ? ", since recovered" : "") + ")"));
  }
  const node = el("section", { class: "card" },
    el("h2", {}, el("span", { class: "dot " + level, title: level }), source.name,
       el("span", { class: "chip" }, source.kind)),
    list);
  if (source.accepts_files) node.append(uploader(source));
  const streams = Object.entries(source.progress || {});
  if (streams.length) {
    streams.sort((a, b) => a[1] - b[1]);
    const table = el("table");
    const labels = source.labels || {};
    for (const [stream, ms] of streams) {
      // Labels need not be unique, so the stream's own identifier stays visible beside one.
      const name = labels[stream]
        ? el("td", {}, labels[stream], " ", el("span", { class: "muted id" }, stream))
        : el("td", {}, stream);
      table.append(el("tr", {}, name, el("td", {}, ago(now - ms / 1000))));
    }
    node.append(el("details", {}, el("summary", {},
      streams.length + " stream(s), oldest complete " + ago(now - streams[0][1] / 1000)), table));
  }
  return node;
}

async function refresh() {
  const problem = document.getElementById("problem");
  try {
    const response = await fetch("api/status", { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const doc = await response.json();
    const meta = "version " + doc.version + (doc.revision ? " (" + doc.revision.slice(0, 7) + ")" : "")
      + " · up " + ago(doc.now - doc.started_at).replace(" ago", "")
      + " · alerts " + (doc.alerts ? "on" : "off");
    document.getElementById("meta").textContent = meta;
    if (hint.source) {
      hint.stale = true;
    } else {
      document.getElementById("sources").replaceChildren(...doc.sources.map(s => card(s, doc)));
    }
    problem.style.display = "none";
  } catch (error) {
    problem.textContent = "cannot load the status: " + error.message;
    problem.style.display = "inline";
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
