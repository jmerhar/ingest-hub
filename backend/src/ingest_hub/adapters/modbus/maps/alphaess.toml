# AlphaESS hybrid inverters and batteries (Storion SMILE, Hi) over Modbus TCP or RTU (unit 85).
#
# Holding registers, from AlphaESS's register parameter list as decoded by the Alpha2MQTT project
# (github.com/dxoverdy/Alpha2MQTT), whose scales follow readings from a real system. Types and
# scales can differ between models and firmware versions; check new readings for plausibility.
#
# Tables: grid (the grid meter), pv_meter (a meter on a separate PV inverter, when fitted),
# battery, inverter (the hybrid inverter, its PV strings and backup output), system (totals and
# faults), timing and dispatch (the battery's charge and discharge control, which a controller
# such as evcc may set), and the slow-changing inverter_info, system_info and system_config.
#
# Built from Alpha2MQTT's Definitions.h and RegisterHandler.cpp; write-only registers are
# left out.

description = "AlphaESS hybrid inverter and battery"
table_prefix = "alphaess_"
function = 3
max_read = 100
max_gap = 8

[tables.inverter_info]
every_seconds = 3600

[tables.system_info]
every_seconds = 3600

[tables.system_config]
every_seconds = 3600

