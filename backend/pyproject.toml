[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingest-hub"
version = "0.1.0"
description = "Config-driven ingest service: pluggable source adapters writing to time-series sinks"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "jigkit[influx,heartbeat,notify,web]==0.8.2",
    "httpx2>=2.16",
    # The MQTT source.
    "aiomqtt>=2.5,<3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # Time zones for TZ, which the slim base image may not carry.
    "tzdata>=2026.5",
]

[project.optional-dependencies]
test = [
    "jigkit[testing]==0.8.2",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[project.scripts]
ingest-hub = "ingest_hub.cli:main"

[project.urls]
Homepage = "https://github.com/jmerhar/ingest-hub"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ingest_hub"]
# Async throughout. Coverage's sys.monitoring core (COVERAGE_CORE=sysmon, set in
# bin/test-backend.sh) traces lines after `await`, which the legacy C core under-reports.
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]
